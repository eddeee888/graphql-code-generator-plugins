name: 'Release'

on:
  push:
    branches:
      - master

  # `/release-snapshot` PR comments start a `workflow_dispatch` run of this workflow.
  # npm rejects trusted publishing (OIDC) tokens from `issue_comment` runs,
  # so snapshots are only published from `workflow_dispatch`.
  issue_comment:
    types: [created]

  workflow_dispatch:
    inputs:
      pr:
        description: 'Pull request number to publish a snapshot of'
        required: true
        type: number

env:
  github-token: ${{ secrets.GITHUB_TOKEN }}
  snapshot-release-tag: pr${{ inputs.pr }}-run${{ github.run_number }}-${{ github.run_attempt }}

jobs:
  release:
    name: Release
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      id-token: write # allows ODIC publishing
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v2

      - name: Create Release Pull Request or Publish to NPM
        id: changesets
        uses: changesets/action@v2.0.0-next.4
        with:
          publish-script: pnpm release
        env:
          GITHUB_TOKEN: ${{ env.github-token }}

  release-snapshot-trigger:
    if: github.event_name == 'issue_comment' && github.event.issue.pull_request
    runs-on: ubuntu-24.04
    permissions:
      actions: write # allows starting the workflow_dispatch run
      pull-requests: write
    steps:
      - name: Acknowledge deployment request to commenter
        id: check
        uses: khan/pull-request-comment-trigger@v1.1.0
        with:
          trigger: '/release-snapshot'
          prefix_only: true
          reaction: rocket
        env:
          GITHUB_TOKEN: ${{ env.github-token }}

      - name: Validate user
        id: validate
        if: ${{ steps.check.outputs.triggered == 'true' }}
        run: |
          if [[ "${AUTHOR_ASSOCIATION}" != 'OWNER' ]]
          then
            echo "User authorization failed"
            exit 1
          else
            echo "User authorization successful"
            exit 0
          fi
        env:
          AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association }}

      - name: Start snapshot release
        id: start
        if: ${{ steps.check.outputs.triggered == 'true' }}
        run: gh workflow run release.yml --repo "$REPO" --ref "$DEFAULT_BRANCH" -f pr="$PR_NUMBER"
        env:
          GH_TOKEN: ${{ env.github-token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          PR_NUMBER: ${{ github.event.issue.number }}

      - name: Report permission failure
        if: failure() && steps.validate.outcome == 'failure'
        uses: octokit/request-action@v3.0.0
        with:
          route: POST /repos/{owner}/{repo}/issues/{issue_number}/comments
          owner: ${{ github.repository_owner }}
          repo: ${{ github.event.repository.name }}
          issue_number: ${{ github.event.issue.number }}
          body: '❌ No permission to release snapshot'
        env:
          GITHUB_TOKEN: ${{ env.github-token }}

      - name: Report start failure
        if: failure() && steps.start.outcome == 'failure'
        uses: octokit/request-action@v3.0.0
        with:
          route: POST /repos/{owner}/{repo}/issues/{issue_number}/comments
          owner: ${{ github.repository_owner }}
          repo: ${{ github.event.repository.name }}
          issue_number: ${{ github.event.issue.number }}
          body: '❌ Failed to start snapshot release'
        env:
          GITHUB_TOKEN: ${{ env.github-token }}

  release-snapshot:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      id-token: write # allows ODIC publishing
      contents: read
      pull-requests: write # allows posting a message to the PR about success/error
    steps:
      - name: Get Pull Request ref
        id: get_pull_request_ref
        uses: octokit/request-action@v3.0.0
        with:
          route: GET /repos/{owner}/{repo}/pulls/{issue_number}
          owner: ${{ github.repository_owner }}
          repo: ${{ github.event.repository.name }}
          issue_number: ${{ inputs.pr }}
        env:
          GITHUB_TOKEN: ${{ env.github-token }}

      - uses: actions/checkout@v7
        with:
          persist-credentials: true
          repository: ${{ fromJson(steps.get_pull_request_ref.outputs.data).head.repo.full_name }}
          ref: ${{ fromJson(steps.get_pull_request_ref.outputs.data).head.ref }}
      - uses: pnpm/setup@v2

      - name: Deploy snapshot
        run: |
          pnpm changeset version --snapshot $RELEASE_TAG
          pnpm nx run-many --target=build
          pnpm changeset publish --tag alpha --no-git-tag
        env:
          GITHUB_TOKEN: ${{ env.github-token }}
          RELEASE_TAG: ${{ env.snapshot-release-tag }}

      - name: Get snapshot versions
        id: get_snapshot_versions
        run: |
          # pkg name -> local package dir
          PACKAGES=(
            "@eddeee888/gcg-operation-location-migration:packages/operation-location-migration"
            "@eddeee888/gcg-server-config:packages/server-config"
            "@eddeee888/gcg-typescript-resolver-files:packages/typescript-resolver-files"
          )

          echo "versions<<EOF" >> $GITHUB_OUTPUT
          for entry in "${PACKAGES[@]}"; do
            pkg="${entry%%:*}"  # part before the first ":"
            dir="${entry##*:}"  # part after the last ":"
            local_version=$(node -p "require('./$dir/package.json').version")

            if [[ "$local_version" != 0.0.0-"$RELEASE_TAG"-* ]]; then
              # Not touched by this PR's changesets, so nothing was published for it
              # this run - leave it out of the comment entirely.
              continue
            fi

            # Published in this run: `changeset version --snapshot` already wrote this
            # exact version to package.json, so use it directly instead of asking the
            # registry - `pnpm view`/npm's dist-tags read can lag a few seconds behind
            # a publish and return the previous alpha version instead of the one we
            # just published.
            version="$local_version"

            echo "" >> $GITHUB_OUTPUT
            echo "$pkg@$version" >> $GITHUB_OUTPUT
          done
          echo "" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        env:
          RELEASE_TAG: ${{ env.snapshot-release-tag }}

      - name: Report success
        if: success()
        uses: octokit/request-action@v3.0.0
        with:
          route: POST /repos/{owner}/{repo}/issues/{issue_number}/comments
          owner: ${{ github.repository_owner }}
          repo: ${{ github.event.repository.name }}
          issue_number: ${{ inputs.pr }}
          body: |
            ✅ **Snapshot published**

            ```bash
            ${{ steps.get_snapshot_versions.outputs.versions }}
            ```
        env:
          GITHUB_TOKEN: ${{ env.github-token }}

      - name: Report failure
        if: failure()
        uses: octokit/request-action@v3.0.0
        with:
          route: POST /repos/{owner}/{repo}/issues/{issue_number}/comments
          owner: ${{ github.repository_owner }}
          repo: ${{ github.event.repository.name }}
          issue_number: ${{ inputs.pr }}
          body: '❌ Failed to publish package/s with tag `${{ env.snapshot-release-tag }}`'
        env:
          GITHUB_TOKEN: ${{ env.github-token }}
