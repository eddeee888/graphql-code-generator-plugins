name: operation-location-migration-e2e

on:
  workflow_call:

jobs:
  operation-location-migration-e2e:
    strategy:
      matrix:
        os: [ubuntu-22.04, windows-latest]
        node-version: [22, 24]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/setup@v2
        with:
          runtime: node@${{ matrix.node-version }}

      - name: e2e
        run: pnpm nx e2e operation-location-migration-e2e
